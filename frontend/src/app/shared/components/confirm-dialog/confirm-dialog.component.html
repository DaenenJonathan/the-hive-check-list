<div class="confirm-dialog-backdrop" *ngIf="state$ | async as state" (click)="confirmDialogService.respond(false)">
  <div class="confirm-dialog-card" (click)="$event.stopPropagation()">
    <h3>{{ state.title }}</h3>
    <p>{{ state.message }}</p>
    <div class="confirm-dialog-actions">
      <button type="button" class="btn btn-secondary" (click)="confirmDialogService.respond(false)">
        {{ state.cancelLabel || ('COMMON.CANCEL' | translate) }}
      </button>
      <button type="button" class="btn"
              [class.btn-danger]="state.variant === 'danger'"
              [class.btn-success]="state.variant === 'success'"
              [class.btn-primary]="!state.variant || state.variant === 'primary'"
              (click)="confirmDialogService.respond(true)">
        {{ state.confirmLabel }}
      </button>
    </div>
  </div>
</div>
