<div class="login-container">
  <div class="login-card">
    <h1>{{ 'REGISTER.TITLE' | translate }}</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>{{ 'REGISTER.FIRSTNAME' | translate }}</label>
        <input type="text" formControlName="firstName" class="form-control" />
      </div>
      <div class="form-group">
        <label>{{ 'REGISTER.LASTNAME' | translate }}</label>
        <input type="text" formControlName="lastName" class="form-control" />
      </div>
      <div class="form-group">
        <label>{{ 'LOGIN.EMAIL' | translate }}</label>
        <input type="email" formControlName="email" class="form-control" />
      </div>
      <div class="form-group">
        <label>{{ 'LOGIN.PASSWORD' | translate }}</label>
        <input type="password" formControlName="password" class="form-control" />
        <small
          class="hint"
          *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
        >{{ 'REGISTER.PASSWORD_HINT' | translate }}</small>
      </div>
      <div class="form-group">
        <label>{{ 'REGISTER.CONFIRM_PASSWORD' | translate }}</label>
        <input type="password" formControlName="confirmPassword" class="form-control" />
        <small
          class="hint"
          *ngIf="form.get('confirmPassword')?.touched && form.errors?.['passwordMismatch']"
        >{{ 'REGISTER.PASSWORD_MISMATCH' | translate }}</small>
      </div>
      <div class="error" *ngIf="error">{{ error | translate }}</div>
      <button type="submit" [disabled]="loading || form.invalid" class="btn btn-primary">
        {{ loading ? ('COMMON.LOADING' | translate) : ('REGISTER.SUBMIT' | translate) }}
      </button>
    </form>
    <p class="register-link">
      {{ 'REGISTER.HAVE_ACCOUNT' | translate }}
      <a [routerLink]="['..']">{{ 'REGISTER.LOGIN_LINK' | translate }}</a>
    </p>
  </div>
</div>
