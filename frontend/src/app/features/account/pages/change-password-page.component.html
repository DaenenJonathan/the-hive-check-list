<div class="login-container">
  <div class="login-card">
    <h1>{{ 'CHANGE_PASSWORD.TITLE' | translate }}</h1>
    <p class="hint" *ngIf="forced">{{ 'CHANGE_PASSWORD.FORCED_HINT' | translate }}</p>

    <div class="success" *ngIf="success">{{ 'CHANGE_PASSWORD.SUCCESS' | translate }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success">
      <div class="form-group">
        <label>{{ 'CHANGE_PASSWORD.CURRENT' | translate }}</label>
        <input type="password" formControlName="currentPassword" class="form-control" />
      </div>
      <div class="form-group">
        <label>{{ 'CHANGE_PASSWORD.NEW' | translate }}</label>
        <input type="password" formControlName="newPassword" class="form-control" />
        <small class="hint">{{ 'CHANGE_PASSWORD.RULES' | translate }}</small>
      </div>
      <div class="form-group">
        <label>{{ 'CHANGE_PASSWORD.CONFIRM' | translate }}</label>
        <input type="password" formControlName="confirmPassword" class="form-control" />
      </div>
      <div class="error" *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.dirty">
        {{ 'CHANGE_PASSWORD.MISMATCH' | translate }}
      </div>
      <div class="error" *ngIf="error">{{ error | translate }}</div>
      <button type="submit" [disabled]="loading || form.invalid" class="btn btn-primary">
        {{ loading ? ('COMMON.LOADING' | translate) : ('CHANGE_PASSWORD.SUBMIT' | translate) }}
      </button>
    </form>

    <p class="register-link" *ngIf="!forced && !success">
      <a [routerLink]="['/actions']">{{ 'CHANGE_PASSWORD.CANCEL_LINK' | translate }}</a>
    </p>
  </div>
</div>
